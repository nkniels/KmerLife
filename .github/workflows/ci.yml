name: CI 
 
on: 
  pull_request: 
    branches: [main] 
  push: 
    branches: [main] 
 
jobs: 
  validate: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 
      - uses: actions/setup-node@v4 
        with: 
          node-version: '22' 
          cache: npm 
      - run: npm ci 
      - run: npm run lint 
      - run: npm run typecheck 
      - run: npm test 
      - name: Economy smoke test 
        run: npm run simulate -- --players 200 --days 30 --seed 1 
